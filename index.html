<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니 게임 천국 (3-in-1 Arcade)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 50%, #311042 100%);
            color: #F8FAFC;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow: hidden;
        }

        .arcade-container {
            background-color: #1E293B;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 2px solid #334155;
            text-align: center;
            position: relative;
            max-width: 440px;
            width: 100%;
        }

        h1 {
            color: #38BDF8;
            font-size: 1.6rem;
            margin-bottom: 12px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .game-tabs {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 12px;
            background-color: #0F172A;
            padding: 5px;
            border-radius: 14px;
            border: 1px solid #334155;
        }

        .tab-btn {
            flex: 1;
            background-color: transparent;
            color: #94A3B8;
            border: none;
            padding: 8px 6px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: #38BDF8;
            color: #0F172A;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .status-board {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #0F172A;
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #CBD5E1;
            border: 1px solid #334155;
        }

        .status-board span {
            color: #FACC15;
            font-size: 0.95rem;
        }

        .mode-select-box {
            display: none;
            gap: 6px;
            margin-bottom: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .mode-btn {
            background-color: #0F172A;
            color: #94A3B8;
            border: 1px solid #334155;
            padding: 5px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active.angel { background-color: #F472B6; color: #FFFFFF; }
        .mode-btn.active.easy { background-color: #22C55E; color: #0F172A; }
        .mode-btn.active.hard { background-color: #EAB308; color: #0F172A; }
        .mode-btn.active.demon { background-color: #A855F7; color: #F8FAFC; }

        .canvas-wrapper {
            position: relative;
            width: 360px;
            height: 480px;
            margin: 0 auto;
        }

        canvas#gameCanvas {
            background-color: #0F172A;
            border: 3px solid #334155;
            border-radius: 16px;
            display: block;
            touch-action: none;
        }

        .tetris-panel {
            display: none;
            position: absolute;
            top: 10px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 6px;
            text-align: center;
        }

        .tetris-panel span {
            font-size: 0.75rem;
            font-weight: bold;
            color: #38BDF8;
            display: block;
            margin-bottom: 4px;
        }

        #holdBox { left: 8px; }
        #nextPreviewBox { right: 8px; }

        .controls-info {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #94A3B8;
            background-color: #0F172A;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .touch-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 10px;
            max-width: 260px;
            margin-left: auto;
            margin-right: auto;
        }

        .ctrl-btn {
            background-color: #334155;
            color: #F8FAFC;
            border: 1px solid #475569;
            padding: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }

        .ctrl-btn:active {
            background-color: #38BDF8;
            color: #0F172A;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .overlay h2 {
            font-size: 1.6rem;
            color: #38BDF8;
            margin-bottom: 8px;
        }

        .overlay p {
            font-size: 0.9rem;
            color: #CBD5E1;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .btn {
            background-color: #38BDF8;
            color: #0F172A;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 8px;
        }

        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 80%;
            margin-bottom: 15px;
            background-color: #0F172A;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .settings-item span {
            font-size: 0.95rem;
            font-weight: bold;
            color: #F8FAFC;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #38BDF8;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }
    </style>
</head>
<body>

    <div class="arcade-container">
        <h1>🕹️ 미니 게임 천국</h1>

        <div class="game-tabs">
            <button class="tab-btn active" onclick="switchGame('snake', event)">🐍 스네이크</button>
            <button class="tab-btn" onclick="switchGame('tetris', event)">🧩 테트리스</button>
            <button class="tab-btn" onclick="switchGame('parking', event)">🚗 주차 게임</button>
        </div>

        <div class="mode-select-box" id="modeSelectBox">
            <button class="mode-btn active angel" onclick="setParkingMode('angel')">👼 천사</button>
            <button class="mode-btn easy" onclick="setParkingMode('easy')">🟢 쉬움</button>
            <button class="mode-btn hard" onclick="setParkingMode('hard')">🟡 하드</button>
            <button class="mode-btn demon" onclick="setParkingMode('demon')">😈 악마</button>
        </div>

        <div class="status-board" id="statusBoard"></div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="360" height="480"></canvas>
            
            <div class="tetris-panel" id="holdBox">
                <span>HOLD (C)</span>
                <canvas id="holdCanvas" width="55" height="55"></canvas>
            </div>

            <div class="tetris-panel" id="nextPreviewBox">
                <span>NEXT</span>
                <canvas id="nextCanvas" width="55" height="55"></canvas>
            </div>
        </div>

        <div class="controls-info" id="controlsInfo"></div>

        <div class="touch-controls" id="touchControls">
            <button class="ctrl-btn" id="btnHold">HOLD</button>
            <button class="ctrl-btn" id="btnUp">▲</button>
            <button class="ctrl-btn" id="btnReset">RESET (R)</button>
            <button class="ctrl-btn" id="btnLeft">◄</button>
            <button class="ctrl-btn" id="btnDown">▼</button>
            <button class="ctrl-btn" id="btnRight">►</button>
        </div>

        <div id="gameOverlay" class="overlay">
            <h2 id="overlayTitle">미니 게임 선택</h2>
            <p id="overlayText">게임 탭을 고르고 시작 버튼을 누르세요!</p>
            <button class="btn" id="startBtn" onclick="startGame()">게임 시작</button>
        </div>

        <!-- 설정 창 오버레이 -->
        <div id="settingsOverlay" class="overlay" style="display: none;">
            <h2>⚙️ 게임 설정</h2>
            <p>ESC 키를 누르면 게임으로 돌아갑니다.</p>
            
            <div class="settings-item">
                <span>🌈 무지개 효과</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="rainbowToggle" checked onchange="toggleRainbow(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <button class="btn" onclick="closeSettings()">닫기 (Resume)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');
        const holdCanvas = document.getElementById('holdCanvas');
        const holdCtx = holdCanvas.getContext('2d');

        const nextPreviewBox = document.getElementById('nextPreviewBox');
        const holdBox = document.getElementById('holdBox');
        const modeSelectBox = document.getElementById('modeSelectBox');

        const statusBoard = document.getElementById('statusBoard');
        const controlsInfo = document.getElementById('controlsInfo');
        const overlay = document.getElementById('gameOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayText = document.getElementById('overlayText');
        const startBtn = document.getElementById('startBtn');
        const settingsOverlay = document.getElementById('settingsOverlay');

        let currentGame = 'snake';
        let isGameRunning = false;
        let isPaused = false;
        let useRainbowEffect = true;
        let animationId = null;

        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, Space: false, KeyC: false };

        function toggleRainbow(enabled) {
            useRainbowEffect = enabled;
            if (isPaused) {
                if (currentGame === 'snake') renderSnake();
                if (currentGame === 'tetris') renderTetris();
            }
        }

        function openSettings() {
            if (!isGameRunning || isPaused) return;
            isPaused = true;
            settingsOverlay.style.display = 'flex';
        }

        function closeSettings() {
            if (!isPaused) return;
            isPaused = false;
            settingsOverlay.style.display = 'none';
            
            if (currentGame === 'snake') {
                lastSnakeStepTime = Date.now();
                gameLoopSnake();
            } else if (currentGame === 'tetris') {
                tetrisState.lastDropTime = Date.now();
                gameLoopTetris();
            } else if (currentGame === 'parking') {
                gameLoopParking();
            }
        }

        function resetCurrentGame() {
            if (isPaused) closeSettings();
            if (currentGame === 'parking') {
                resetParkingState();
            }
            startGame();
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'Escape' || e.key === 'Esc') {
                e.preventDefault();
                if (isPaused) {
                    closeSettings();
                } else if (isGameRunning) {
                    openSettings();
                }
                return;
            }

            if (isPaused) return;

            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
                e.preventDefault();
            }
            if (e.key === 'r' || e.key === 'R') {
                resetCurrentGame();
                return;
            }

            if (e.code === 'Space') keys.Space = true;
            if (e.key === 'c' || e.key === 'C') {
                keys.KeyC = true;
                if (isGameRunning && currentGame === 'tetris') holdTetris();
            }
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;

            if (isGameRunning) {
                if (currentGame === 'snake') handleSnakeInput(e.key);
                if (currentGame === 'tetris') handleTetrisInput(e.key);
            }
        });

        window.addEventListener('keyup', e => {
            if (isPaused) return;
            if (e.code === 'Space') keys.Space = false;
            if (e.key === 'c' || e.key === 'C') keys.KeyC = false;
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        function bindTouch(id, action) {
            const btn = document.getElementById(id);
            const start = (e) => {
                e.preventDefault();
                if (isPaused) return;
                if (action === 'Reset') {
                    resetCurrentGame();
                    return;
                }
                if (isGameRunning) {
                    if (action === 'KeyC' && currentGame === 'tetris') holdTetris();
                    else if (currentGame === 'snake') handleSnakeInput(action);
                    else if (currentGame === 'tetris') handleTetrisInput(action);
                }
                keys[action] = true;
            };
            const end = (e) => { e.preventDefault(); if (action !== 'Reset') keys[action] = false; };
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        }

        bindTouch('btnUp', 'ArrowUp');
        bindTouch('btnDown', 'ArrowDown');
        bindTouch('btnLeft', 'ArrowLeft');
        bindTouch('btnRight', 'ArrowRight');
        bindTouch('btnHold', 'KeyC');
        bindTouch('btnReset', 'Reset');

        function switchGame(gameType, evt) {
            if (isPaused) closeSettings();
            currentGame = gameType;
            isGameRunning = false;
            if (animationId) cancelAnimationFrame(animationId);
            if (snakeState.timer) clearInterval(snakeState.timer);

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (evt) evt.target.classList.add('active');

            const isTetris = (gameType === 'tetris');
            nextPreviewBox.style.display = isTetris ? 'block' : 'none';
            holdBox.style.display = isTetris ? 'block' : 'none';
            modeSelectBox.style.display = (gameType === 'parking') ? 'flex' : 'none';

            if (gameType === 'parking') {
                resetParkingState();
            }

            initGameUI();
            overlay.style.display = 'flex';
            
            if (gameType === 'snake') {
                overlayTitle.innerText = "🐍 스네이크 게임";
                overlayText.innerHTML = "먹이를 먹어 몸집을 키우세요!<br>ESC 키로 일시 정지 및 설정을 켤 수 있습니다.";
            } else if (gameType === 'tetris') {
                overlayTitle.innerText = "🧩 무지개 테트리스";
                overlayText.innerHTML = "ESC 키로 무지개 효과를 켜고 끌 수 있습니다!<br>Hold(C), Hard Drop(Space), Reset(R)";
            } else if (gameType === 'parking') {
                overlayTitle.innerText = "🚗 주차 게임";
                overlayText.innerHTML = "총 10개의 장애물 코스가 제공됩니다.<br>조향을 잘 맞춰 주차해 보세요!";
            }
            startBtn.innerText = "게임 시작";
        }

        function setParkingMode(mode) {
            parkingMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.mode-btn.${mode}`).classList.add('active');
            resetParkingState();
            initGameUI();
        }

        function resetParkingState() {
            parkingLevel = 1;
            if (parkingMode === 'angel') parkingLives = '∞';
            else if (parkingMode === 'easy') parkingLives = 5;
            else if (parkingMode === 'hard') parkingLives = 4;
            else if (parkingMode === 'demon') parkingLives = 3;
        }

        function initGameUI() {
            if (currentGame === 'snake') {
                statusBoard.innerHTML = `<div>점수: <span id="score">0</span>점</div><div>최고: <span id="highScore">${snakeState.highScore}</span>점</div>`;
                controlsInfo.innerHTML = `🎮 <b>방향키</b> 이동 | <b>ESC</b>: 설정 | <b>R</b>: 리셋`;
            } else if (currentGame === 'tetris') {
                statusBoard.innerHTML = `<div>점수: <span id="score">0</span>점</div><div>줄: <span id="lines">0</span></div>`;
                controlsInfo.innerHTML = `🎮 <b>◄/►</b>: 이동 | <b>▲</b>: 회전 | <b>▼</b>: 하강 | <b>ESC</b>: 설정 | <b>C</b>: Hold`;
            } else if (currentGame === 'parking') {
                const modeMap = { angel: '👼천사', easy: '쉬움', hard: '하드', demon: '😈악마' };
                statusBoard.innerHTML = `<div>모드: <span>${modeMap[parkingMode]}</span></div><div>목숨: <span id="lives">${parkingLives}</span></div><div>단계: <span id="level">${parkingLevel}</span>/10</div>`;
                controlsInfo.innerHTML = `🎮 <b>▲</b>: 전진 | <b>▼</b>: 후진 | <b>◄/►</b>: 조향 | <b>ESC</b>: 설정`;
            }
        }

        function startGame() {
            overlay.style.display = 'none';
            isGameRunning = true;
            isPaused = false;

            if (currentGame === 'snake') startSnake();
            else if (currentGame === 'tetris') startTetris();
            else if (currentGame === 'parking') {
                if (parkingLives !== '∞' && parkingLives <= 0) {
                    resetParkingState();
                }
                initGameUI();
                startParkingLevel();
            }
        }

        function gameOver(msg, scoreInfo) {
            isGameRunning = false;
            isPaused = false;
            if (animationId) cancelAnimationFrame(animationId);
            if (snakeState.timer) clearInterval(snakeState.timer);

            overlayTitle.innerText = "💥 게임 오버!";
            overlayText.innerHTML = `${msg}<br>${scoreInfo}`;
            startBtn.innerText = "다시 도전하기";
            overlay.style.display = 'flex';
        }

        function getRainbowGradient(context, width, height, speed = 0.002) {
            const time = Date.now() * speed;
            const rainbowGrad = context.createLinearGradient(0, 0, width, height);
            rainbowGrad.addColorStop((0.0 + time) % 1, '#FF0000');
            rainbowGrad.addColorStop((0.2 + time) % 1, '#FF7F00');
            rainbowGrad.addColorStop((0.4 + time) % 1, '#FFFF00');
            rainbowGrad.addColorStop((0.6 + time) % 1, '#00FF00');
            rainbowGrad.addColorStop((0.8 + time) % 1, '#0000FF');
            rainbowGrad.addColorStop((1.0 + time) % 1, '#8B00FF');
            return rainbowGrad;
        }

        /* --- 1. 스네이크 게임 --- */
        const SNAKE_GRID = 20;
        const SNAKE_COLS = 18;
        const SNAKE_ROWS = 24;

        const snakeState = {
            snake: [], dx: SNAKE_GRID, dy: 0,
            food: { x: 0, y: 0 }, score: 0, highScore: 0,
            timer: null, changingDirection: false
        };

        function startSnake() {
            snakeState.snake = [
                { x: 8 * SNAKE_GRID, y: 10 * SNAKE_GRID },
                { x: 7 * SNAKE_GRID, y: 10 * SNAKE_GRID }
            ];
            snakeState.dx = SNAKE_GRID;
            snakeState.dy = 0;
            snakeState.score = 0;
            snakeState.changingDirection = false;

            spawnSnakeFood();
            if (snakeState.timer) clearInterval(snakeState.timer);
            
            if (animationId) cancelAnimationFrame(animationId);
            gameLoopSnake();
        }

        let lastSnakeStepTime = 0;
        function gameLoopSnake() {
            if (!isGameRunning || currentGame !== 'snake' || isPaused) return;

            const now = Date.now();
            if (now - lastSnakeStepTime > 110) {
                updateSnake();
                lastSnakeStepTime = now;
            }

            renderSnake();
            if (!isPaused) {
                animationId = requestAnimationFrame(gameLoopSnake);
            }
        }

        function spawnSnakeFood() {
            let newX, newY;
            let occupied = false;

            do {
                newX = Math.floor(Math.random() * SNAKE_COLS) * SNAKE_GRID;
                newY = Math.floor(Math.random() * SNAKE_ROWS) * SNAKE_GRID;
                
                occupied = snakeState.snake.some(segment => segment.x === newX && segment.y === newY);
            } while (occupied);

            snakeState.food = { x: newX, y: newY };
        }

        function handleSnakeInput(key) {
            if (snakeState.changingDirection) return;

            if ((key === 'ArrowLeft' || key === 'Left') && snakeState.dx === 0) {
                snakeState.dx = -SNAKE_GRID; snakeState.dy = 0; snakeState.changingDirection = true;
            } else if ((key === 'ArrowUp' || key === 'Up') && snakeState.dy === 0) {
                snakeState.dx = 0; snakeState.dy = -SNAKE_GRID; snakeState.changingDirection = true;
            } else if ((key === 'ArrowRight' || key === 'Right') && snakeState.dx === 0) {
                snakeState.dx = SNAKE_GRID; snakeState.dy = 0; snakeState.changingDirection = true;
            } else if ((key === 'ArrowDown' || key === 'Down') && snakeState.dy === 0) {
                snakeState.dx = 0; snakeState.dy = SNAKE_GRID; snakeState.changingDirection = true;
            }
        }

        function updateSnake() {
            snakeState.changingDirection = false;
            const head = { x: snakeState.snake[0].x + snakeState.dx, y: snakeState.snake[0].y + snakeState.dy };

            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                if (snakeState.score > snakeState.highScore) snakeState.highScore = snakeState.score;
                gameOver("벽에 부딪혔습니다!", `최종 점수: <b>${snakeState.score}점</b>`);
                return;
            }

            for (let part of snakeState.snake) {
                if (head.x === part.x && head.y === part.y) {
                    if (snakeState.score > snakeState.highScore) snakeState.highScore = snakeState.score;
                    gameOver("자신의 몸에 부딪혔습니다!", `최종 점수: <b>${snakeState.score}점</b>`);
                    return;
                }
            }

            snakeState.snake.unshift(head);

            if (head.x === snakeState.food.x && head.y === snakeState.food.y) {
                snakeState.score += 10;
                document.getElementById('score').innerText = snakeState.score;
                spawnSnakeFood();
            } else {
                snakeState.snake.pop();
            }
        }

        function renderSnake() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (useRainbowEffect) {
                ctx.save();
                ctx.globalAlpha = 0.25;
                ctx.fillStyle = getRainbowGradient(ctx, canvas.width, canvas.height, 0.0008);
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += SNAKE_GRID) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += SNAKE_GRID) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            ctx.fillStyle = '#FF4757';
            ctx.beginPath();
            ctx.arc(snakeState.food.x + SNAKE_GRID / 2, snakeState.food.y + SNAKE_GRID / 2, SNAKE_GRID / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            const snakeColor = useRainbowEffect ? getRainbowGradient(ctx, canvas.width, canvas.height) : '#2ED573';

            snakeState.snake.forEach((part, index) => {
                ctx.fillStyle = snakeColor;
                ctx.fillRect(part.x + 1, part.y + 1, SNAKE_GRID - 2, SNAKE_GRID - 2);

                if (index === 0) {
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(part.x + 2, part.y + 2, SNAKE_GRID - 4, SNAKE_GRID - 4);
                }
            });
        }

        /* --- 2. 테트리스 --- */
        const COLS = 10, ROWS = 20, BLOCK = 24;
        const SHAPES = [
            [],
            [[1, 1, 1, 1]], // I (하늘색)
            [[1, 0, 0], [1, 1, 1]], // J (파란색)
            [[0, 0, 1], [1, 1, 1]], // L (주황색)
            [[1, 1], [1, 1]], // O (노란색)
            [[0, 1, 1], [1, 1, 0]], // S (초록색)
            [[0, 1, 0], [1, 1, 1]], // T (보라색)
            [[1, 1, 0], [0, 1, 1]]  // Z (빨간색)
        ];

        const TETRIS_COLORS = [
            null,
            '#00F0FF', // 1: I
            '#0000FF', // 2: J
            '#FFA500', // 3: L
            '#FFFF00', // 4: O
            '#00FF00', // 5: S
            '#A000F0', // 6: T
            '#FF0000'  // 7: Z
        ];

        let tetrisBoard = [];
        let particles = []; 
        let dropTrails = []; // 하강 시 생기는 잔상 블록 배열
        const tetrisState = { score: 0, lines: 0, piece: null, nextQueue: [], holdPiece: null, canHold: true, lastDropTime: 0 };

        function getRandomPiece() {
            const id = Math.floor(Math.random() * 7) + 1;
            return { id: id, shape: SHAPES[id], x: 3, y: 0 };
        }

        function createShatterEffect(row, col, color) {
            const offsetX = (canvas.width - COLS * BLOCK) / 2;
            const startX = offsetX + col * BLOCK + BLOCK / 2;
            const startY = row * BLOCK + BLOCK / 2;

            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: startX,
                    y: startY,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.8) * 7,
                    size: Math.random() * 4 + 3,
                    color: color,
                    alpha: 1.0,
                    rotation: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.3,
                    gravity: 0.25
                });
            }
        }

        // 하강할 때 뒤에 남는 잔상 블록 생성 함수
        function addDropTrail(startY, endY) {
            const p = tetrisState.piece;
            if (!p) return;
            const color = useRainbowEffect ? '#38BDF8' : TETRIS_COLORS[p.id];
            
            for (let r = 0; r < p.shape.length; r++) {
                for (let c = 0; c < p.shape[r].length; c++) {
                    if (p.shape[r][c]) {
                        for (let y = startY; y <= endY; y++) {
                            dropTrails.push({
                                gridX: p.x + c,
                                gridY: y + r,
                                alpha: 0.4,
                                color: color
                            });
                        }
                    }
                }
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.alpha -= 0.025;
                p.rotation += p.vRot;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
            }
        }

        // 잔상(Trail) 페이드 아웃 및 그리기 함수
        function updateAndDrawTrails() {
            const offsetX = (canvas.width - COLS * BLOCK) / 2;
            for (let i = dropTrails.length - 1; i >= 0; i--) {
                let t = dropTrails[i];
                t.alpha -= 0.04; // 잔상이 점점 사라짐

                if (t.alpha <= 0) {
                    dropTrails.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = Math.max(0, t.alpha);
                ctx.fillStyle = t.color;
                ctx.fillRect(offsetX + t.gridX * BLOCK + 2, t.gridY * BLOCK + 2, BLOCK - 4, BLOCK - 4);
                ctx.restore();
            }
        }

        function startTetris() {
            tetrisBoard = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            particles = [];
            dropTrails = [];
            tetrisState.score = 0;
            tetrisState.lines = 0;
            tetrisState.holdPiece = null;
            tetrisState.canHold = true;
            tetrisState.nextQueue = [getRandomPiece(), getRandomPiece()];
            tetrisState.lastDropTime = Date.now();

            spawnTetrisPiece();
            if (animationId) cancelAnimationFrame(animationId);
            gameLoopTetris();
        }

        function gameLoopTetris() {
            if (!isGameRunning || currentGame !== 'tetris' || isPaused) return;

            const now = Date.now();
            if (now - tetrisState.lastDropTime > 500) {
                dropTetris();
                tetrisState.lastDropTime = now;
            }

            renderTetris();
            if (!isPaused) {
                animationId = requestAnimationFrame(gameLoopTetris);
            }
        }

        function spawnTetrisPiece() {
            tetrisState.piece = tetrisState.nextQueue.shift();
            tetrisState.nextQueue.push(getRandomPiece());
            tetrisState.canHold = true;
            if (checkTetrisCollide(0, 0)) {
                gameOver("블록이 가득 찼습니다!", `최종 점수: <b>${tetrisState.score}점</b>`);
            }
        }

        function holdTetris() {
            if (!tetrisState.canHold) return;

            if (!tetrisState.holdPiece) {
                tetrisState.holdPiece = { id: tetrisState.piece.id, shape: SHAPES[tetrisState.piece.id] };
                spawnTetrisPiece();
            } else {
                const temp = { id: tetrisState.piece.id, shape: SHAPES[tetrisState.piece.id] };
                const hId = tetrisState.holdPiece.id;
                tetrisState.piece = { id: hId, shape: SHAPES[hId], x: 3, y: 0 };
                tetrisState.holdPiece = temp;
            }
            tetrisState.canHold = false;
        }

        function checkTetrisCollide(offsetX, offsetY, shape = tetrisState.piece.shape) {
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c]) {
                        let newX = tetrisState.piece.x + c + offsetX;
                        let newY = tetrisState.piece.y + r + offsetY;
                        if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                        if (newY >= 0 && tetrisBoard[newY][newX]) return true;
                    }
                }
            }
            return false;
        }

        function getGhostY() {
            let ghostY = 0;
            while (!checkTetrisCollide(0, ghostY + 1)) {
                ghostY++;
            }
            return tetrisState.piece.y + ghostY;
        }

        function handleTetrisInput(key) {
            if (!isGameRunning || currentGame !== 'tetris') return;
            if (key === 'ArrowLeft' && !checkTetrisCollide(-1, 0)) tetrisState.piece.x--;
            if (key === 'ArrowRight' && !checkTetrisCollide(1, 0)) tetrisState.piece.x++;
            if (key === 'ArrowDown') {
                const startY = tetrisState.piece.y;
                dropTetris();
                addDropTrail(startY, tetrisState.piece.y);
                tetrisState.lastDropTime = Date.now();
            }
            if (key === 'ArrowUp') rotateTetris();
            if (key === 'Space' || key === ' ') {
                const startY = tetrisState.piece.y;
                const ghostY = getGhostY();
                addDropTrail(startY, ghostY); // 하드 드롭 시 전체 낙하 경로에 잔상 생성
                tetrisState.piece.y = ghostY;
                dropTetris();
                tetrisState.lastDropTime = Date.now();
            }
        }

        function rotateTetris() {
            const rotated = tetrisState.piece.shape[0].map((_, i) =>
                tetrisState.piece.shape.map(row => row[i]).reverse()
            );
            if (!checkTetrisCollide(0, 0, rotated)) tetrisState.piece.shape = rotated;
        }

        function dropTetris() {
            if (!checkTetrisCollide(0, 1)) {
                const startY = tetrisState.piece.y;
                tetrisState.piece.y++;
                addDropTrail(startY, tetrisState.piece.y);
            } else {
                const p = tetrisState.piece;
                for (let r = 0; r < p.shape.length; r++) {
                    for (let c = 0; c < p.shape[r].length; c++) {
                        if (p.shape[r][c] && p.y + r >= 0) {
                            tetrisBoard[p.y + r][p.x + c] = p.id;
                        }
                    }
                }
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (tetrisBoard[r].every(cell => cell !== 0)) {
                        for (let c = 0; c < COLS; c++) {
                            const blockId = tetrisBoard[r][c];
                            const pColor = useRainbowEffect ? '#FACC15' : TETRIS_COLORS[blockId];
                            createShatterEffect(r, c, pColor);
                        }

                        tetrisBoard.splice(r, 1);
                        tetrisBoard.unshift(Array(COLS).fill(0));
                        tetrisState.lines++;
                        tetrisState.score += 100;
                        document.getElementById('score').innerText = tetrisState.score;
                        document.getElementById('lines').innerText = tetrisState.lines;
                        r++;
                    }
                }
                spawnTetrisPiece();
            }
        }

        function drawPiecePreview(ctxRef, pieceObj) {
            ctxRef.clearRect(0, 0, 55, 55);
            if (!pieceObj) return;
            const shape = pieceObj.shape;
            const miniBlock = 11;
            const startX = (55 - shape[0].length * miniBlock) / 2;
            const startY = (55 - shape.length * miniBlock) / 2;

            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c]) {
                        ctxRef.fillStyle = useRainbowEffect ? getRainbowGradient(ctxRef, 55, 55) : TETRIS_COLORS[pieceObj.id];
                        ctxRef.fillRect(startX + c * miniBlock, startY + r * miniBlock, miniBlock - 1, miniBlock - 1);
                    }
                }
            }
        }

        function renderTetris() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const offsetX = (canvas.width - COLS * BLOCK) / 2;

            if (useRainbowEffect) {
                ctx.save();
                ctx.globalAlpha = 0.25;
                ctx.fillStyle = getRainbowGradient(ctx, COLS * BLOCK, ROWS * BLOCK, 0.0008);
                ctx.fillRect(offsetX, 0, COLS * BLOCK, ROWS * BLOCK);
                ctx.restore();
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            for (let c = 0; c <= COLS; c++) {
                ctx.beginPath(); ctx.moveTo(offsetX + c * BLOCK, 0); ctx.lineTo(offsetX + c * BLOCK, ROWS * BLOCK); ctx.stroke();
            }
            for (let r = 0; r <= ROWS; r++) {
                ctx.beginPath(); ctx.moveTo(offsetX, r * BLOCK); ctx.lineTo(offsetX + COLS * BLOCK, r * BLOCK); ctx.stroke();
            }

            // 착지된 기존 테트리스 블록
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const blockId = tetrisBoard[r][c];
                    if (blockId) {
                        ctx.fillStyle = useRainbowEffect ? getRainbowGradient(ctx, canvas.width, canvas.height) : TETRIS_COLORS[blockId];
                        ctx.fillRect(offsetX + c * BLOCK + 1, r * BLOCK + 1, BLOCK - 2, BLOCK - 2);
                    }
                }
            }

            // 하강 잔상 그려주기
            updateAndDrawTrails();

            if (tetrisState.piece) {
                const p = tetrisState.piece;
                const ghostY = getGhostY();
                const currentPieceColor = useRainbowEffect ? getRainbowGradient(ctx, canvas.width, canvas.height) : TETRIS_COLORS[p.id];

                // 바닥 착지 지점 미리보기 (Ghost Block)
                ctx.fillStyle = currentPieceColor;
                ctx.globalAlpha = 0.25;
                for (let r = 0; r < p.shape.length; r++) {
                    for (let c = 0; c < p.shape[r].length; c++) {
                        if (p.shape[r][c]) {
                            const gx = offsetX + (p.x + c) * BLOCK;
                            const gy = ghostY * BLOCK + r * BLOCK;
                            ctx.fillRect(gx + 1, gy + 1, BLOCK - 2, BLOCK - 2);
                        }
                    }
                }

                ctx.globalAlpha = 1.0;
                ctx.strokeStyle = currentPieceColor;
                ctx.lineWidth = 2;
                for (let r = 0; r < p.shape.length; r++) {
                    for (let c = 0; c < p.shape[r].length; c++) {
                        if (p.shape[r][c]) {
                            const gx = offsetX + (p.x + c) * BLOCK;
                            const gy = ghostY * BLOCK + r * BLOCK;
                            ctx.strokeRect(gx + 2, gy + 2, BLOCK - 4, BLOCK - 4);
                        }
                    }
                }

                // 현재 조종 중인 테트리스 블록
                ctx.fillStyle = currentPieceColor;
                for (let r = 0; r < p.shape.length; r++) {
                    for (let c = 0; c < p.shape[r].length; c++) {
                        if (p.shape[r][c]) {
                            ctx.fillRect(offsetX + (p.x + c) * BLOCK + 1, (p.y + r) * BLOCK + 1, BLOCK - 2, BLOCK - 2);
                        }
                    }
                }
            }

            // 블록 깨짐 파티클 이펙트
            updateAndDrawParticles();

            drawPiecePreview(holdCtx, tetrisState.holdPiece);
            drawPiecePreview(nextCtx, tetrisState.nextQueue[0]);
        }

        /* --- 3. 주차 게임 --- */
        let parkingLevel = 1;
        let parkingMode = 'angel';
        let parkingLives = '∞';

        const car = {
            x: 0, y: 0,
            width: 18, height: 34,
            angle: 0, speed: 0,
            maxSpeed: 2, accel: 0.1, friction: 0.04, turnSpeed: 0.05
        };

        const standardLevels = [
            { start: { x: 180, y: 420, angle: 0 }, park: { x: 140, y: 40, w: 80, h: 65 }, walls: [] },
            { start: { x: 60, y: 420, angle: 0 }, park: { x: 260, y: 50, w: 70, h: 60 }, walls: [{ x: 140, y: 180, w: 80, h: 120 }] },
            { start: { x: 180, y: 430, angle: 0 }, park: { x: 180, y: 40, w: 60, h: 60 }, walls: [{ x: 40, y: 220, w: 130, h: 30 }, { x: 190, y: 220, w: 130, h: 30 }] },
            { start: { x: 50, y: 420, angle: 0 }, park: { x: 270, y: 420, w: 65, h: 50 }, walls: [{ x: 150, y: 300, w: 30, h: 180 }, { x: 0, y: 150, w: 250, h: 30 }] },
            { start: { x: 180, y: 430, angle: 0 }, park: { x: 40, y: 40, w: 60, h: 60 }, walls: [{ x: 0, y: 120, w: 260, h: 25 }, { x: 100, y: 270, w: 260, h: 25 }] },
            { start: { x: 50, y: 50, angle: Math.PI / 2 }, park: { x: 260, y: 400, w: 70, h: 60 }, walls: [{ x: 120, y: 0, w: 30, h: 320 }, { x: 210, y: 160, w: 30, h: 320 }] },
            { start: { x: 180, y: 420, angle: 0 }, park: { x: 150, y: 210, w: 60, h: 60 }, walls: [{ x: 40, y: 100, w: 280, h: 20 }, { x: 40, y: 340, w: 280, h: 20 }, { x: 40, y: 100, w: 20, h: 260 }, { x: 300, y: 100, w: 20, h: 260 }] },
            { start: { x: 50, y: 420, angle: 0 }, park: { x: 50, y: 50, w: 60, h: 60 }, walls: [{ x: 120, y: 350, w: 240, h: 20 }, { x: 0, y: 230, w: 240, h: 20 }, { x: 120, y: 110, w: 240, h: 20 }] },
            { start: { x: 310, y: 430, angle: 0 }, park: { x: 30, y: 40, w: 60, h: 60 }, walls: [{ x: 200, y: 300, w: 30, h: 180 }, { x: 100, y: 180, w: 260, h: 30 }, { x: 0, y: 300, w: 120, h: 30 }] },
            { start: { x: 180, y: 430, angle: 0 }, park: { x: 150, y: 30, w: 60, h: 55 }, walls: [{ x: 0, y: 350, w: 140, h: 20 }, { x: 220, y: 350, w: 140, h: 20 }, { x: 80, y: 230, w: 200, h: 20 }, { x: 0, y: 110, w: 140, h: 20 }, { x: 220, y: 110, w: 140, h: 20 }] }
        ];

        function startParkingLevel() {
            const lvl = standardLevels[parkingLevel - 1];
            car.x = lvl.start.x;
            car.y = lvl.start.y;
            car.angle = lvl.start.angle;
            car.speed = 0;

            if (animationId) cancelAnimationFrame(animationId);
            gameLoopParking();
        }

        function gameLoopParking() {
            if (!isGameRunning || currentGame !== 'parking' || isPaused) return;

            updateParking();
            renderParking();

            if (isGameRunning && !isPaused) {
                animationId = requestAnimationFrame(gameLoopParking);
            }
        }

        function updateParking() {
            if (keys.ArrowUp) car.speed = Math.min(car.speed + car.accel, car.maxSpeed);
            else if (keys.ArrowDown) car.speed = Math.max(car.speed - car.accel, -car.maxSpeed / 2);
            else {
                if (car.speed > 0) car.speed = Math.max(0, car.speed - car.friction);
                else if (car.speed < 0) car.speed = Math.min(0, car.speed + car.friction);
            }

            if (Math.abs(car.speed) > 0.05) {
                const dir = car.speed > 0 ? 1 : -1;
                if (keys.ArrowLeft) car.angle -= car.turnSpeed * dir;
                if (keys.ArrowRight) car.angle += car.turnSpeed * dir;
            }

            car.x += Math.sin(car.angle) * car.speed;
            car.y -= Math.cos(car.angle) * car.speed;

            const lvl = standardLevels[parkingLevel - 1];

            let crashed = false;
            if (car.x < 10 || car.x > canvas.width - 10 || car.y < 10 || car.y > canvas.height - 10) {
                crashed = true;
            }

            for (let wall of lvl.walls) {
                if (car.x > wall.x && car.x < wall.x + wall.w && car.y > wall.y && car.y < wall.y + wall.h) {
                    crashed = true;
                    break;
                }
            }

            if (crashed) {
                handleParkingCrash();
                return;
            }

            const p = lvl.park;
            if (car.x > p.x && car.x < p.x + p.w && car.y > p.y && car.y < p.y + p.h && Math.abs(car.speed) < 0.2) {
                if (parkingLevel < 10) {
                    parkingLevel++;
                    initGameUI();
                    startParkingLevel();
                } else {
                    gameOver("🎉 축하합니다! 모든 주차 코스를 클리어하셨습니다!", "명예의 전당 등극!");
                }
            }
        }

        function handleParkingCrash() {
            if (parkingLives !== '∞') {
                parkingLives--;
                if (parkingLives <= 0) {
                    gameOver("모든 목숨을 소진했습니다!", `최종 도달 단계: <b>Level ${parkingLevel}</b>`);
                    return;
                }
            }
            initGameUI();
            startParkingLevel();
        }

        function renderParking() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const lvl = standardLevels[parkingLevel - 1];

            const p = lvl.park;
            ctx.fillStyle = 'rgba(34, 197, 94, 0.2)';
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.strokeStyle = '#22C55E';
            ctx.lineWidth = 2;
            ctx.strokeRect(p.x, p.y, p.w, p.h);

            ctx.fillStyle = '#EF4444';
            for (let wall of lvl.walls) {
                ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
            }

            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            ctx.fillStyle = '#38BDF8';
            ctx.fillRect(-car.width / 2, -car.height / 2, car.width, car.height);
            ctx.fillStyle = '#0F172A';
            ctx.fillRect(-car.width / 2 + 2, -car.height / 2 + 4, car.width - 4, 8);
            ctx.restore();
        }

        switchGame('snake');
    </script>
